name: Refresh approved state camera directories
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-approved-camera-directories
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'scottew/monitor-the-situation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 747a4e2c493d76108be96483594831053617cbff
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Arizona directory
        run: |
          if [ -n "$MTS_AZ_511_API_KEY" ]; then
            node scripts/refresh-state-snapshots.js AZ
          else
            echo "Arizona awaits secure key setup."
          fi
        env:
          MTS_AZ_511_API_KEY: ${{ secrets.MTS_AZ_511_API_KEY }}
      - name: Georgia directory
        if: ${{ always() }}
        run: |
          if [ -n "$MTS_GA_511_API_KEY" ]; then
            node scripts/refresh-state-snapshots.js GA
          else
            echo "Georgia awaits secure key setup."
          fi
        env:
          MTS_GA_511_API_KEY: ${{ secrets.MTS_GA_511_API_KEY }}
